server:
  port: 8080

spring:
  application:
    name: mini-kanban

  datasource:
    url: jdbc:postgresql://localhost:5432/miniKanban
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate   # Flyway owns the schema; Hibernate only validates
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

JWT_SECRET: ${JWT_SECRET:dGVzdFNlY3JldEtleUZvckxvY2FsRGV2VGVzdGluZzEyMw==}
JWT_EXPIRY_MS: ${JWT_EXPIRY_MS:86400000}

logging:
  level:
    com.zaxxer.hikari: DEBUG
    org.springframework.jdbc.datasource: DEBUG

